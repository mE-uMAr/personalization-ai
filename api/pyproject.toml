[project]
name = "personalization-api"
version = "0.1.0"
description = "AI Personalization Engine demo: FastAPI service and offline seed pipeline"
requires-python = ">=3.12"
# API runtime only. No ML libraries: all models run offline in the seed step.
dependencies = [
    "fastapi[standard]==0.163.2",  # [standard]: the fastapi CLI that FastAPI Cloud runs the app with
    "uvicorn[standard]==0.54.0",
    "pg8000==1.31.6",
    "numpy==2.5.5",
]

[dependency-groups]
# Offline seed pipeline (never loaded by the API).
seed = [
    "scipy==1.18.1",
    "scikit-learn==1.9.1",            # HDBSCAN (falls back to seed/hdbscan_np.py if unavailable)
    "onnxruntime==1.32.0",            # bge-m3 embeddings
    "tokenizers==0.23.3",
    "piper-tts==1.8.0",               # offline neural narration (AR + EN)
    "imageio-ffmpeg==0.8.1",          # muxing
    "opencv-python-headless==5.1.0.95",
]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false
# Hosts (Vercel, FastAPI Cloud) install only the runtime dependencies above. Locally, run.cmd installs all groups.
default-groups = []

# The ASGI app, for hosts that look it up (Vercel and FastAPI Cloud).
[tool.vercel]
entrypoint = "app.main:app"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
